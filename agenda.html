
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Agenda inteligente PROSPERA">
  <title>Agenda | PROSPERA</title>

  <link rel="stylesheet" href="css/agenda.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #101827;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .agenda-container {
      width: 100%;
      max-width: 1400px;
      margin: auto;
    }

    .agenda-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .agenda-header h1 {
      margin: 0;
      color: #d8b45b;
    }

    .agenda-header p {
      color: #aab4c5;
      margin-bottom: 0;
    }

    .agenda-toolbar,
    .agenda-navigation {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .agenda-button {
      border: 1px solid #35445b;
      background: #1b2940;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
    }

    .agenda-button:hover {
      border-color: #d8b45b;
    }

    .agenda-button.active,
    .agenda-button.primary {
      background: #d8b45b;
      color: #101827;
      border-color: #d8b45b;
      font-weight: bold;
    }

    .agenda-panel {
      background: #172337;
      border: 1px solid #293a53;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      min-width: 0;
    }

    .agenda-period {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    #month-title {
      font-size: 20px;
      color: #d8b45b;
      margin: 0;
      text-transform: capitalize;
    }

    /* Calendário mensal */

    #days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .calendar-weekday {
      text-align: center;
      padding: 10px 2px;
      color: #d8b45b;
      font-weight: bold;
    }

    .calendar-day {
      min-height: 55px;
      border: 1px solid #30415a;
      border-radius: 7px;
      background: #1d2b42;
      color: white;
      position: relative;
    }

    .calendar-day:hover,
    .calendar-day.selected {
      border-color: #d8b45b;
      background: #30415a;
    }

    .calendar-day.today {
      outline: 2px solid #d8b45b;
    }

    .calendar-day.outside-month {
      opacity: .35;
    }

    .calendar-dot {
      width: 6px;
      height: 6px;
      background: #d8b45b;
      border-radius: 50%;
      position: absolute;
      bottom: 7px;
      left: calc(50% - 3px);
    }

    /* Grade semanal e diária */

    #schedule-wrap {
      width: 100%;
      overflow-x: auto;
      max-height: 75vh;
      overflow-y: auto;
    }

    #schedule-wrap[hidden] {
      display: none;
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: 65px repeat(7, minmax(105px, 1fr));
      grid-template-rows: 42px repeat(96, 24px);
      min-width: 850px;
      position: relative;
      background: #172337;
    }

    .schedule-grid.day-schedule {
      grid-template-columns: 65px minmax(220px, 1fr);
      min-width: 320px;
    }

    .schedule-corner,
    .schedule-day-head {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #24344c;
      border: 1px solid #3a4c65;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d8b45b;
      font-weight: bold;
      font-size: 12px;
    }

    .schedule-corner {
      left: 0;
      z-index: 7;
    }

    .schedule-time {
      grid-column: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 3px;
      font-size: 10px;
      color: #aab4c5;
      background: #1d2b42;
      border-bottom: 1px solid #30415a;
      position: sticky;
      left: 0;
      z-index: 2;
    }

    .schedule-slot {
      grid-row: auto;
      min-width: 0;
      border: 0;
      border-right: 1px solid #30415a;
      border-bottom: 1px solid #30415a;
      background: transparent;
      padding: 0;
    }

    .schedule-slot:hover {
      background: rgba(216, 180, 91, .13);
    }

    .schedule-event {
      z-index: 3;
      margin: 2px;
      padding: 5px;
      overflow: hidden;
      text-align: left;
      color: #101827;
      background: #d8b45b;
      border: 0;
      border-radius: 5px;
      font-size: 11px;
      font-weight: bold;
      min-width: 0;
    }

    /* Lista de compromissos */

    #selected-title {
      color: #d8b45b;
      text-transform: capitalize;
    }

    #events {
      display: grid;
      gap: 10px;
    }

    .agenda-event-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 13px;
      border: 1px solid #35445b;
      background: #1d2b42;
      border-radius: 8px;
    }

    .agenda-event-info {
      display: grid;
      gap: 5px;
    }

    .agenda-event-time {
      color: #d8b45b;
      font-size: 13px;
    }

    .agenda-event-description {
      color: #aab4c5;
      margin: 3px 0;
      white-space: pre-wrap;
    }

    .agenda-event-actions {
      display: flex;
      gap: 7px;
    }

    .agenda-event-actions button {
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid #52627a;
      background: #263750;
      color: white;
    }

    .agenda-event-actions button:hover {
      border-color: #d8b45b;
    }

    .empty-events {
      color: #aab4c5;
    }

    /* Formulário */

    #form-area[hidden],
    #event-form[hidden] {
      display: none;
    }

    #form-area {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      background: rgba(0, 0, 0, .75);
      overflow-y: auto;
    }

    #event-form {
      width: 100%;
      max-width: 480px;
      padding: 22px;
      background: #172337;
      border: 1px solid #d8b45b;
      border-radius: 12px;
      display: grid;
      gap: 13px;
    }

    #event-form h2 {
      color: #d8b45b;
      margin: 0;
    }

    #event-form label {
      display: grid;
      gap: 6px;
      color: #dce3ed;
      font-size: 13px;
    }

    #event-form input,
    #event-form textarea {
      width: 100%;
      padding: 11px;
      border-radius: 7px;
      border: 1px solid #43536b;
      background: #101827;
      color: white;
    }

    #event-form textarea {
      min-height: 80px;
      resize: vertical;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .agenda-panel {
        padding: 12px;
      }

      .calendar-day {
        min-height: 43px;
      }

      .agenda-header h1 {
        font-size: 24px;
      }

      .agenda-toolbar,
      .agenda-navigation {
        width: 100%;
      }

      .agenda-button {
        padding: 9px 10px;
      }
      .auth-panel {
  display: grid;
  gap: 12px;
}

.auth-fields {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}

.auth-fields label {
  display: grid;
  gap: 6px;
  color: #dce3ed;
  font-size: 13px;
}

.auth-fields input {
  width: 100%;
  padding: 11px;
  border: 1px solid #43536b;
  border-radius: 7px;
  background: #101827;
  color: white;
}

.auth-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.auth-status {
  color: #aab4c5;
}
    }
  </style>
</head>

<body>
  <main class="agenda-container">

    <header class="agenda-header">
      <div>
        <h1>PROSPERA</h1>
        <p>Minha agenda inteligente</p>
      </div>

      <button
        type="button"
        class="agenda-button primary"
        id="add-event-button">
        + Novo compromisso
      </button>
    </header>
<section class="agenda-panel auth-panel">
  <h2>Acesso à sua conta</h2>
  <p id="auth-status" class="auth-status" aria-live="polite">
    Entre ou crie sua conta para acessar sua agenda.
  </p>

  <form id="auth-form">
    <div class="auth-fields">
      <label>
        E-mail
        <input
          type="email"
          id="auth-email"
          autocomplete="email"
          required
          placeholder="Seu e-mail">
      </label>

      <label>
        Senha
        <input
          type="password"
          id="auth-password"
          autocomplete="current-password"
          minlength="6"
          required
          placeholder="Sua senha">
      </label>
    </div>

    <div class="auth-actions">
      <button type="button" class="agenda-button primary" id="login-button">
        Entrar
      </button>

      <button type="button" class="agenda-button" id="signup-button">
        Criar conta
      </button>
    </div>
  </form>

  <div id="auth-session" hidden>
    <p id="auth-user"></p>
    <button type="button" class="agenda-button" id="logout-button">
      Sair da conta
    </button>
  </div>
</section>
    <section class="agenda-panel">

      <div class="agenda-toolbar">
        <button type="button" class="agenda-button active" data-view="month">
          Mês
        </button>

        <button type="button" class="agenda-button" data-view="week">
          Semana
        </button>

        <button type="button" class="agenda-button" data-view="day">
          Dia
        </button>
      </div>

      <div class="agenda-period">
        <h2 id="month-title">Agenda</h2>

        <div class="agenda-navigation">
          <button type="button" class="agenda-button" id="prev-period">
            ‹
          </button>

          <button type="button" class="agenda-button" id="today-button">
            Hoje
          </button>

          <button type="button" class="agenda-button" id="next-period">
            ›
          </button>
        </div>
      </div>

      <div id="days"></div>

      <div id="schedule-wrap" hidden>
        <div id="schedule-grid" class="schedule-grid"></div>
      </div>

    </section>

    <section class="agenda-panel">
      <h2 id="selected-title">Compromissos</h2>
      <div id="events"></div>
    </section>

  </main>

  <!-- Formulário de compromisso -->
  <div id="form-area" hidden>

    <form id="event-form" hidden>

      <h2 data-form-title>Novo compromisso</h2>

      <input type="hidden" id="event-id" name="id">

      <label>
        Título do compromisso
        <input
          type="text"
          name="title"
          maxlength="120"
          placeholder="Ex.: Reunião, consulta, estudo..."
          required>
      </label>

      <label>
        Descrição
        <textarea
          name="description"
          maxlength="1000"
          placeholder="Detalhes do compromisso"></textarea>
      </label>

      <label>
        Data
        <input
          type="date"
          name="date"
          required>
      </label>

      <label>
        Horário de início
        <input
          type="time"
          name="start"
          step="900"
          required>
      </label>

      <label>
        Horário de término
        <input
          type="time"
          name="end"
          step="900"
          required>
      </label>

      <div class="form-actions">
        <button
          type="button"
          class="agenda-button"
          id="cancel-event">
          Cancelar
        </button>

        <button
          type="submit"
          class="agenda-button primary">
          Salvar compromisso
        </button>
      </div>

    </form>

  </div>

  <script src="js/agenda.js"></script>

</body>
</html>
